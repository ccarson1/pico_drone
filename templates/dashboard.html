<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PicoDrone Live Dashboard</title>

    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/compass.css">
</head>

<body>

    <div class="container">
        <div class="column-left">
            <div class="panel-motors">

                <div>
                    <div class="gauge">
                        <div class="progress">
                            <div class="meter-value">
                                <p id="speed-value-0">0</p>
                            </div>

                            <div class="bar"></div>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="gauge">
                        <div class="progress">
                            <div class="meter-value">
                                <p id="speed-value-1">0</p>
                            </div>
                            <div class="bar"></div>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="gauge">
                        <div class="progress">
                            <div class="meter-value">
                                <p id="speed-value-2">0</p>
                            </div>

                            <div class="bar"></div>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="gauge">
                        <div class="progress">
                            <div class="meter-value">
                                <p id="speed-value-3">0</p>
                            </div>

                            <div class="bar"></div>
                        </div>
                    </div>
                </div>



            </div>
            <button id="connectBtn">Connect to Drone</button>
            <div id="connectStatus" class="status">Press the button to connect</div>
        </div>
        <div class="column-middle">
            <h1>PicoDrone Live Dashboard</h1>


            <div style="display: flex;">
                <div style="display: flex; margin-right: 5%; align-items: center;">
                    <div class="label" style="padding-right: .8em;">Last Update</div>
                    <div class="value" id="timestamp">--:--:--</div>
                </div>
                <div style="display: flex; margin-right: 5%; align-items: center;">
                    <div class="label" style="padding-right: .8em;">Battery Level</div>
                    <div class="value" id="battery">--%</div>
                </div>

            </div>
            <video id="droneStream" width="100%" height="480" style="background-color: rgb(34, 48, 64);" autoplay muted
                playsinline>
                <source src="" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div>
                <p id="keyDisplay"></p>
            </div>






        </div>
        <div class="column-right">
            <div class="grid">
                <div class="panel two-col">
                    <div class="column">
                        <div class="label">Acceleration (g)</div>
                        <div>X: <span class="value" id="ax">0.000</span></div>
                        <div>Y: <span class="value" id="ay">0.000</span></div>
                        <div>Z: <span class="value" id="az">0.000</span></div>

                    </div>
                    <div class="column">
                        <div class="label">Gyroscope (°/s)</div>
                        <div>X: <span class="value" id="gx">0.000</span></div>
                        <div>Y: <span class="value" id="gy">0.000</span></div>
                        <div>Z: <span class="value" id="gz">0.000</span></div>
                    </div>
                    <div>
                        <button id="calibrateBtn" disabled>Calibrate</button>
                    </div>

                </div>

                <div class="panel">
                    <div class="panel-container">
                        <div class=" attitude-indicator">
                            <div class="horizon" id="horizon">
                                <div class="sky"></div>
                                <div class="ground"></div>
                                <div id="pitch-lines"></div>
                            </div>
                            <div class="fixed-overlay">
                                <div class="aircraft-line"></div>
                                <div class="center-dot"></div>
                            </div>
                        </div>
                        <div class="status" id="level">Board status: —</div>
                    </div>

                    
                    <div class="panel-container compass-container">
                        <div class="compass">
                            <div class="compass-face" id="compassFace"></div>
                            <div class="needle"></div>
                            <div class="compass-center"></div>
                        </div>
                        <p class="status" id="heading">Heading: 0°</p>
                    </div>
                </div>

                <div class="panel panel-altimeter">
                    <div class="panel-container altimeter-gauge">
                        <div class="altimeter-needle" id="altimeter-needle"></div>
                        <div class="altimeter-scale">
                            <!-- optional tick marks -->
                        </div>
                        <div class="altimeter-value" id="altimeter-value">0 mm</div>
                    </div>
                </div>

                <div class="panel">
                    <input type="range" min="0" max="100" value="0" class="slider" id="accel">
                    <div id="accel-val">0</div>
                </div>
            </div>
        </div>
    </div>


    <script src="/static/keyhandler.js?v=1"></script>
    <script src="/static/app.js"></script>
    <script src="/static/compass.js"></script>

</body>

</html>
