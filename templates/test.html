<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compass</title>
<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f0f0f0;
    font-family: sans-serif;
}

.compass-container {
    text-align: center;
}

.compass {
    position: relative;
    width: 200px;
    height: 200px;
    border: 6px solid #333;
    border-radius: 50%;
    background: radial-gradient(circle at center, #161b22 0%, #333 100%);
    margin: 0 auto 20px auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
    overflow: hidden;
}

.compass-face {
    position: absolute;
    width: 100%;
    height: 100%;
    transform-origin: center center;
    transition: transform 0.3s ease-out;
}

/* Needle container (centered) */
.needle {
    position: absolute;
    width: 0;
    height: 0;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
}

/* Red tip pointing outward */
.needle::before {
    content: '';
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 80px solid red;
}

/* White tail pointing inward */
.needle::after {
    content: '';
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%) rotate(180deg);
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 60px solid white;
}

.compass-center {
    position: absolute;
    width: 20px;
    height: 20px;
    background: #333;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
}

.direction {
    position: absolute;
    font-weight: bold;
    font-size: 16px;
    user-select: none;
    top: 50%;
    left: 50%;
    transform-origin: center 0; /* top of letter points outward */
}

.degree-mark {
    position: absolute;
    width: 2px;
    height: 10px;
    background: #ddd;
    top: 50%;
    left: 50%;
    transform-origin: bottom center;
}
</style>
</head>
<body>
<div class="compass-container">
    <div class="compass">
        <div class="compass-face" id="compassFace"></div>
        <div class="needle"></div>
        <div class="compass-center"></div>
    </div>
    <p id="heading">Heading: 0°</p>
</div>

<script>
const compassFace = document.getElementById('compassFace');
const headingText = document.getElementById('heading');

const compassSize = 200;
const compassRadius = compassSize / 2 - 20;
const letterRadius = compassRadius - 30;

// Add direction letters
const directions = ["N","NE","E","SE","S","SW","W","NW"];
directions.forEach((dir, i)=>{
    const angle = i * 45; // degrees
    const rad = angle * Math.PI/180;

    const el = document.createElement('div');
    el.className = 'direction';
    el.textContent = dir;

    // Rotate around center and move outward
    el.style.transform = `rotate(${angle}deg) translateY(-${letterRadius}px) rotate(0deg)`;
    compassFace.appendChild(el);
});

// Add degree marks
for(let i=0; i<360; i+=10){
    const mark = document.createElement('div');
    mark.className = 'degree-mark';
    const length = (i % 30 === 0)?15:8;
    mark.style.height = `${length}px`;

    // Rotate around center
    mark.style.transform = `rotate(${i}deg) translateY(-${compassRadius}px)`;
    compassFace.appendChild(mark);
}

// Update compass
function updateCompass(heading){
    compassFace.style.transform = `rotate(${-heading}deg)`;
    headingText.textContent = `Heading: ${Math.round(heading)}°`;
}

// Simulation
let simulatedHeading = 0;
setInterval(()=>{
    simulatedHeading = (simulatedHeading+1)%360;
    updateCompass(simulatedHeading);
},100);
</script>
</body>
</html>
